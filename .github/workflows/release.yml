name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to publish (e.g. v1.4.1-custom.1). Empty keeps the SHA pre-release only."
        required: false
        default: ""

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  APP_NAME: Ghostty Custom
  BUNDLE_ID: com.joshuarli.ghostty-custom
  ARTIFACT: Ghostty-Custom-aarch64-apple-darwin.dmg
  LINUX_ARTIFACT_X64: ghostty-custom-x86_64-linux-musl.tar.gz
  LINUX_ARTIFACT_ARM64: ghostty-custom-aarch64-linux-musl.tar.gz
  LINUX_SOFTWARE_ARTIFACT_X64: ghostty-custom-software-x86_64-linux-musl.tar.gz

jobs:
  build:
    name: Build
    runs-on: xcode-27
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: ghosttykit-aarch64-macos

      - name: Build GhosttyKit
        run: zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos.27.0 -Dxcframework-target=native -Demit-macos-app=false -Dsentry=false

      - name: Build app
        working-directory: macos
        run: xcodebuild -target Ghostty -configuration ReleaseLocal -arch arm64 PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" INFOPLIST_KEY_CFBundleDisplayName="$APP_NAME"

      - name: Verify bundle
        run: |
          app="macos/build/ReleaseLocal/Ghostty.app"
          test -x "$app/Contents/MacOS/ghostty"
          test "$(lipo -archs "$app/Contents/MacOS/ghostty")" = arm64
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = "$APP_NAME"
          codesign -dv --strict "$app" 2>&1 | grep -q "adhoc"

      - name: Package app
        run: |
          rm -rf pkg
          mkdir pkg
          ditto "macos/build/ReleaseLocal/Ghostty.app" "pkg/$APP_NAME.app"
          ./dist/macos/make-dmg.sh "pkg/$APP_NAME.app" "$ARTIFACT" "$APP_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-custom-aarch64-apple-darwin
          path: ${{ env.ARTIFACT }}

  linux-x64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    container: alpine:edge
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain and dependencies
        shell: sh
        run: |
          apk add --no-cache bash git xz file binutils clang cmake ninja make pkgconfig tar zstd \
            wayland-dev libxkbcommon-dev mesa-egl mesa-dev libseat-dev ncurses

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: laputa-x86_64-linux-musl

      - name: Verify Zig in container PATH
        run: zig version

      - name: Build Laputa Wayland binary
        run: |
          zig build -Dapp-runtime=wayland -Doptimize=ReleaseFast -Dstrip=true \
            -Demit-themes=false -Di18n=false -Dcpu=baseline

      - name: Verify musl static-ish binary
        run: |
          file zig-out/bin/ghostty | tee file.txt
          grep -q "ELF 64-bit LSB.*x86-64" file.txt
          grep -q "musl" file.txt || readelf -l zig-out/bin/ghostty | grep -q "ld-musl-x86_64"
          readelf -d zig-out/bin/ghostty | tee dyn.txt
          test "$(grep -c NEEDED dyn.txt)" -le 5
          ! grep NEEDED dyn.txt | grep -Ei "gtk|adwaita|glib|X11|libGL\.|libc\.so\.6"
          ./zig-out/bin/ghostty --version | grep -q "wayland"
          ./zig-out/bin/ghostty +show-config > /dev/null

      - name: Package binary
        run: tar czf "${{ env.LINUX_ARTIFACT_X64 }}" -C zig-out/bin ghostty

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-custom-x86_64-linux-musl
          path: ${{ env.LINUX_ARTIFACT_X64 }}

  linux-x64-software:
    name: Build Linux x86_64 static software
    runs-on: ubuntu-latest
    container: alpine:edge
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain and dependencies
        shell: sh
        run: |
          apk add --no-cache bash git xz file binutils clang cmake ninja make pkgconfig tar zstd \
            libxkbcommon-dev libxkbcommon-static libffi-dev ncurses

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: laputa-software-x86_64-linux-musl

      - name: Run Wayland and renderer tests
        run: |
          zig build test -Dapp-runtime=wayland -Drenderer=software -Dtest-filter=wayland
          zig build test -Dapp-runtime=wayland -Drenderer=software -Dtest-filter=renderer

      - name: Build static software binary
        run: |
          zig build -Dapp-runtime=wayland -Drenderer=software \
            -Dtarget=x86_64-linux-musl -Doptimize=ReleaseFast -Dstrip=true \
            -Demit-themes=false -Di18n=false -Dcpu=baseline

      - name: Verify the binary is fully static
        run: |
          file zig-out/bin/ghostty | tee file.txt
          grep -q "ELF 64-bit LSB.*x86-64" file.txt
          test -z "$(readelf -lW zig-out/bin/ghostty | grep -E 'INTERP')"
          test -z "$(readelf -dW zig-out/bin/ghostty | grep -E 'NEEDED')"
          ./zig-out/bin/ghostty --version | grep -q "wayland"
          ./zig-out/bin/ghostty +show-config > /dev/null

      - name: Package binary
        run: tar czf "${{ env.LINUX_SOFTWARE_ARTIFACT_X64 }}" -C zig-out/bin ghostty

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-custom-software-x86_64-linux-musl
          path: ${{ env.LINUX_SOFTWARE_ARTIFACT_X64 }}

  linux-arm64:
    name: Build Linux aarch64
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JS actions cannot run inside Alpine containers on ARM runners, so the
      # musl build runs in Alpine via docker CLI from the Ubuntu host. This
      # keeps the same mostly-static musl artifact as x86_64.
      - name: Build Laputa Wayland binary in Alpine
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/work" -w /work \
            -e LINUX_ARTIFACT_ARM64 \
            alpine:edge sh -c '
              set -ex
              apk add --no-cache bash git xz file binutils clang cmake ninja make pkgconfig tar zstd curl \
                wayland-dev libxkbcommon-dev mesa-egl mesa-dev libseat-dev ncurses
              curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz
              mkdir -p /opt && tar -xf /tmp/zig.tar.xz -C /opt
              export PATH=/opt/zig-aarch64-linux-0.17.0:$PATH
              zig version
              zig build -Dapp-runtime=wayland -Doptimize=ReleaseFast -Dstrip=true \
                -Demit-themes=false -Di18n=false -Dcpu=baseline > /tmp/build.log 2>&1
              tail -50 /tmp/build.log
              file zig-out/bin/ghostty | tee file.txt
              grep -q "ELF 64-bit LSB.*aarch64" file.txt
              grep -q "musl" file.txt || readelf -l zig-out/bin/ghostty | grep -q "ld-musl-aarch64"
              readelf -d zig-out/bin/ghostty | tee dyn.txt
              test "$(grep -c NEEDED dyn.txt)" -le 5
              ! grep NEEDED dyn.txt | grep -Ei "gtk|adwaita|glib|X11|libGL\.|libc\.so\.6"
              # Baseline CPU only: a native-CPU build (e.g. SVE2 on Neoverse
              # N2 runners) dies with SIGILL on CPUs without those features.
              ! readelf -A zig-out/bin/ghostty | grep -qi sve
              ./zig-out/bin/ghostty --version | grep -q "wayland"
              ./zig-out/bin/ghostty +show-config > /dev/null
              tar czf "$LINUX_ARTIFACT_ARM64" -C zig-out/bin ghostty
            '
        env:
          LINUX_ARTIFACT_ARM64: ${{ env.LINUX_ARTIFACT_ARM64 }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-custom-aarch64-linux-musl
          path: ${{ env.LINUX_ARTIFACT_ARM64 }}

  release:
    name: Create pre-release
    needs: [build, linux-x64, linux-x64-software, linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ghostty-custom-*
          path: dist
          merge-multiple: true

      - name: Checksum manifest
        run: |
          (cd dist && shasum -a 256 "$ARTIFACT" "$LINUX_ARTIFACT_X64" "$LINUX_SOFTWARE_ARTIFACT_X64" "$LINUX_ARTIFACT_ARM64" > SHA256SUMS)
          cat dist/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > dist/COMMIT

      - name: Create pre-release
        if: ${{ inputs.release_tag == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/"$ARTIFACT" dist/"$LINUX_ARTIFACT_X64" dist/"$LINUX_SOFTWARE_ARTIFACT_X64" dist/"$LINUX_ARTIFACT_ARM64" dist/SHA256SUMS dist/COMMIT \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/"$ARTIFACT" dist/"$LINUX_ARTIFACT_X64" dist/"$LINUX_SOFTWARE_ARTIFACT_X64" dist/"$LINUX_ARTIFACT_ARM64" dist/SHA256SUMS dist/COMMIT \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "Ad-hoc signed macOS arm64 build and musl Laputa Wayland builds (x86_64, aarch64) and a fully static x86_64 software-rendered Wayland build of Ghostty Custom at commit $GITHUB_SHA. macOS is not notarized; not an official Ghostty release. Open the .dmg, drag to Applications, then right-click > Open once. The Linux tarballs hold mostly-static musl binaries (dynamic libEGL, libwayland-client, libxkbcommon only); the software tarball is fully static. Run them under any Wayland compositor."
          fi

      - name: Publish versioned release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${{ inputs.release_tag }}" dist/"$ARTIFACT" dist/"$LINUX_ARTIFACT_X64" dist/"$LINUX_SOFTWARE_ARTIFACT_X64" dist/"$LINUX_ARTIFACT_ARM64" dist/SHA256SUMS dist/COMMIT \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "${{ inputs.release_tag }}" dist/"$ARTIFACT" dist/"$LINUX_ARTIFACT_X64" dist/"$LINUX_SOFTWARE_ARTIFACT_X64" dist/"$LINUX_ARTIFACT_ARM64" dist/SHA256SUMS dist/COMMIT \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "${{ inputs.release_tag }}" \
              --notes "Ad-hoc signed macOS arm64 build and musl Laputa Wayland builds (x86_64, aarch64) and a fully static x86_64 software-rendered Wayland build of Ghostty Custom at commit $GITHUB_SHA. macOS is not notarized; not an official Ghostty release. Open the .dmg, drag to Applications, then right-click > Open once. The Linux tarballs hold mostly-static musl binaries (dynamic libEGL, libwayland-client, libxkbcommon only); the software tarball is fully static. Run them under any Wayland compositor."
          fi
